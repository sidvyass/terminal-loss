# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: terminal-loss
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --locked --no-dev && cd web && npm ci && npm run build
    startCommand: uv run --no-dev market-api --host 0.0.0.0
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: NODE_VERSION
        value: "22"
