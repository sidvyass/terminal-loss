name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    name: Web (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: Production server smoke test
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --no-dev
      - run: cd web && npm ci && npm run build
      - name: Start market-api the way Render does and check it serves the app
        env:
          PORT: "10000"
          HOST: 0.0.0.0
        run: |
          uv run --no-dev market-api &
          for i in $(seq 1 30); do curl -sf localhost:10000/api/health && break; sleep 1; done
          curl -sf localhost:10000/api/health | grep -q '"ok":true'
          curl -sf localhost:10000/ | grep -q '<div id="root">'
          curl -sfI localhost:10000/ | grep -qi 'content-security-policy'
