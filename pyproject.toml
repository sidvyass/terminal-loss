[project]
name = "terminal-loss"
version = "0.1.0"
description = "Live market dashboard for your terminal and the web: stocks, rates, commodities and country macro data"
readme = "README.md"
authors = [
    { name = "Siddharth Vyas", email = "sidd.vyass@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "platformdirs>=4.12.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[project.scripts]
market = "terminal_loss.cli:main"
market-api = "terminal_loss.api.app:main"

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # the UI deliberately uses typographic characters (−, ×, …)
    "SIM105",  # try/except/pass reads fine and leaves room for a comment
    "SIM108",  # ternaries only where they read better
]

[tool.pytest.ini_options]
testpaths = ["tests"]
